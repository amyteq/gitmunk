name: Release
# A PR into main must be releasable; a push to main tags vX.Y.Z and publishes its CHANGELOG.md section.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/release/release.py check
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # shortcut: GitHub keeps one pending run per group, so a third push during a publish replaces the second's pending run; rerun that push's workflow if it happens.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/release/release.py publish --notes-file "$RUNNER_TEMP/notes.md")
          if [ -n "$tag" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
